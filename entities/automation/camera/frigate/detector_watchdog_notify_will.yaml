---
alias: /camera/frigate/detector-watchdog-notify-will

id: camera_frigate_detector_watchdog_notify_will

description: Notify Will when Frigate performs or fails automatic detector recovery

mode: queued

max: 10

max_exceeded: silent

trigger:
  - platform: mqtt
    topic: frigate/watchdog/detector

variables:
  watchdog_state: "{{ trigger.payload_json.get('state', '') }}"

  recovery_method: "{{ trigger.payload_json.get('recovery_method', '') }}"

  retry_after_minutes: >-
    {{
      (
        trigger.payload_json.get('retry_after_seconds', 0) | int(0) / 60
      )
      | round(0, 'ceil')
      | int(0)
    }}

  failure_reason: "{{ trigger.payload_json.get('reason', '') }}"

  failure_error: "{{ trigger.payload_json.get('error', '') }}"

condition:
  - condition: template
    value_template: "{{ watchdog_state in ['problem', 'critical', 'resolved'] }}"

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ watchdog_state == 'resolved' }}"
        sequence:
          - action: script.notify_will
            continue_on_error: true
            data:
              title: Frigate detection recovered
              message: >-
                {% if recovery_method == 'external_restart' %}
                  Frigate object detection and camera processing are healthy after the
                  requested LXC restart.
                {% else %}
                  Frigate object detection and camera processing are healthy after the
                  automatic service restart.
                {% endif %}
              notification_id: frigate_detector_watchdog
              mobile_notification_icon: mdi:cctv
              group: frigate-health
              sticky: false
              persistent: false

      - conditions:
          - condition: template
            value_template: "{{ watchdog_state == 'critical' }}"
        sequence:
          - action: script.notify_will
            continue_on_error: true
            data:
              title: Frigate detection needs attention
              message: >-
                {% if failure_reason == 'automatic_restart_suppressed' %}
                  Frigate detection failed again inside the restart safety window.
                  Automatic service recovery becomes available again in about
                  {{ retry_after_minutes }} minutes.
                {% elif failure_reason == 'frigate_full_restart_request_failed' %}
                  The watchdog could not request a full Frigate service restart
                  {% if failure_error %}: {{ failure_error }}{% endif %}.
                {% elif failure_reason == 'frigate_full_restart_not_observed' %}
                  Frigate did not report the requested service restart within the
                  verification timeout.
                {% elif failure_reason == 'recovery_verification_failed' %}
                  Frigate restarted, but detector and camera processing did not recover.
                {% else %}
                  Frigate object detection needs manual attention. Check the watchdog
                  and Frigate logs.
                {% endif %}
                Use the action below to restart the Frigate LXC if you want to escalate.
              notification_id: frigate_detector_watchdog
              mobile_notification_icon: mdi:alert-octagon
              group: frigate-health
              sticky: true
              persistent: true
              actions:
                - action: RESTART_FRIGATE_LXC
                  title: Restart Frigate LXC

    default:
      - action: script.notify_will
        continue_on_error: true
        data:
          title: Restarting Frigate detection
          message: >-
            Detector health remained degraded for one minute. The watchdog requested
            one full Frigate service restart and is verifying detector inference and
            camera processing before declaring recovery.
          notification_id: frigate_detector_watchdog
          mobile_notification_icon: mdi:cctv-off
          group: frigate-health
          sticky: true
          persistent: true
